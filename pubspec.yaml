name: flutter_trim
description: >-
  Interactive CLI that finds unused assets, Dart files, classes, functions and
  methods in Flutter projects and lets you keep or delete each one safely.
version: 1.0.0
homepage: https://github.com/mehedidevv/flutter-trim
repository: https://github.com/mehedidevv/flutter-trim
issue_tracker: https://github.com/mehedidevv/flutter-trim/issues

topics:
  - flutter
  - cli
  - cleanup
  - dead-code
  - code-quality

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # DeclarationUtils only uses AST APIs that exist in every analyzer major
  # from 6.x through 14.x (keyword tokens, childEntities, Token.name), so the
  # tool installs on old and new Dart SDKs alike.
  analyzer: '>=6.2.0 <15.0.0'
  args: ^2.4.2
  glob: ^2.1.2
  mason_logger: ^0.3.1
  path: ^1.8.3
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  flutter_trim: flutter_trim
  ftrim: flutter_trim
